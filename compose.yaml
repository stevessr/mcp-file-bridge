services:
  mcp-file-bridge:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MCP_API_TOKEN: ${MCP_API_TOKEN:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:3000}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-10737418240}
    volumes:
      - ./data:/data
